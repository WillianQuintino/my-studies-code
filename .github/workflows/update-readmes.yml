
name: Atualizar READMEs dos Bootcamps

permissions:
  contents: write
on:
  push:
    branches: [main]

jobs:
  update-readmes:
    if: github.event.head_commit.message != '🤖 Atualização automática dos READMEs'

    runs-on: ubuntu-latest
    # defaults:
      # run:
      #   working-directory: bootcamps/dio.me

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install
        working-directory: bootcamps/dio.me

      - name: Gerar READMEs
        run: npm run update-readmes
        working-directory: bootcamps/dio.me

      - name: Commitar alterações e fazer push
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }} # <- trocado aqui
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git add .
          git commit -m "🤖 Atualização automática dos READMEs" || echo "Sem alterações para commitar"
          git push origin main