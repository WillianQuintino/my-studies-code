
name: Atualizar READMEs dos Bootcamps

on:
  push:
    branches: [main]

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bootcamps/dio.me
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependências (se houver)
        run: npm install

      - name: Executar script de atualização de READMEs
        run: npm run update-readmes

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Atualização automática dos READMEs" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: "${{ secrets.GH_TOKEN }}"